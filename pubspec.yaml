name: game_research
description: "Record a reference game session, drop markers, analyse it."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Exact pins, newest stable (dependency-freshness gate).
dependencies:
  # The frozen family palette, spacing and type scale (unified-design-system).
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.3.1
      path: design_system
  flutter:
    sdk: flutter
  # The page talks to the wrapper; the wrapper talks to OmniRoute and ollama.
  http: 1.6.0
  path: 1.9.1

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
  # Inter 4.1 (SIL OFL 1.1), the document reader's face; bundled, no CDN.
  # Source: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
  #   zip sha256 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e
  #   InterVariable.ttf        4989b125924991b90d05b2d16e0e388c48f7d5bb8b30539bbf9c755278d0ccaf
  #   InterVariable-Italic.ttf d6f1f6a172d9e588438db9f986fd5cfad7b30f644374080a8a9d4d91e344586f
  #   LICENSE.txt (Inter-OFL.txt) 262481e844521b326f5ecd053e59b98c8b2da78c8ee1bdbb6e8174305e54935a
  # Weights are the wght axis (fontVariations), not FontWeight.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic

# The shared icon family (python_pkg/app_icons in testsAndMisc, key
# game_research): charcoal field, glyph in the family accent. The desktop
# build is web-in-Chrome, so the favicon and manifest icons are what the
# app window and the taskbar show.
flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#211D1B"
    theme_color: "#211D1B"
