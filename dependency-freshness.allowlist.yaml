# Repo-local additions to the fleet-wide allowlist in ~/src/utils.
# `transitive:` entries are predicates: they clear themselves when the
# blocker moves, so they carry no `expires`.
exceptions:
  - ecosystem: pub
    package: flutter_svg
    pinned: "2.5.0"
    latest_known: "2.5.1"
    reason: >-
      design_system 0.5.1 (its newest tag) pins flutter_svg 2.5.0 exactly, so
      pub cannot resolve 2.5.1 next to it. The shared theme waits for a
      design_system tag that takes flutter_svg 2.5.1.
    blocked_by: transitive:design_system@0.5.1
